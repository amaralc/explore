name: Experiment
description: Toyota Kata experiment record for testing ideas toward a target condition
title: "Experiment: "
labels: ["experiment"]
body:
  - type: markdown
    attributes:
      value: |
        ## Context
        - **Target condition:** see linked milestone
        - **Obstacle being addressed:** see parent issue

  - type: textarea
    id: expected-result
    attributes:
      label: Expected Result
      description: What do you expect to happen? How will you measure it?
      placeholder: We expect that... and will measure by...
    validations:
      required: true

  - type: dropdown
    id: experiment-type
    attributes:
      label: Type of Experiment
      description: Select the experiment approach
      options:
        - Go and see
        - Exploratory
        - Testing hypothesis
    validations:
      required: true

  - type: input
    id: coach
    attributes:
      label: Coach
      description: GitHub handle of the coach (if applicable)
      placeholder: "@username or N/A"
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What Happened
      description: Actual outcome. Include data if available.
      placeholder: The actual result was...
    validations:
      required: false

  - type: textarea
    id: what-learned
    attributes:
      label: What Did We Learn
      description: Key insight. How does this change our understanding?
      placeholder: We learned that...
    validations:
      required: false

  - type: textarea
    id: next-step
    attributes:
      label: Next Step
      description: Based on what we learned, what is the next experiment? Link to the new issue if created.
      placeholder: The next experiment is...
    validations:
      required: false
