name: Experiment
description: Toyota Kata experiment record for testing ideas toward a target condition
title: "Experiment: "
labels: ["experiment"]
body:
  - type: markdown
    attributes:
      value: |
        ## Context
        - **Target condition:** see linked milestone
        - **Obstacle being addressed:** see parent issue
  
  - type: textarea
    id: step
    attributes:
      label: Next Step
      description: "What is the next step? Should be: (1) small enough to complete quickly, (2) designed to learn something specific about the obstacle, (3) something you can do now."
      placeholder: |
        e.g., Run `pnpm audit` to identify current vulnerability count
        e.g., Pair with @teammate to understand the authentication flow
        e.g., Add a single unit test for the failing edge case
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: Expected Result
      description: "What do you expect to happen? Be specific so you can tell if the result matches your expectation."
      placeholder: |
        e.g., We expect the audit to show fewer than 10 high-severity vulnerabilities
        e.g., We expect the test to pass after adding null check on line 42
        e.g., We expect to understand why the API returns 500 by reading the logs
    validations:
      required: true

  - type: dropdown
    id: experiment-type
    attributes:
      label: Type of Experiment
      description: Select the experiment approach
      options:
        - Go and see
        - Exploratory
        - Testing hypothesis
    validations:
      required: true

  - type: input
    id: coach
    attributes:
      label: Coach
      description: GitHub handle of the coach (if applicable)
      placeholder: "@username or N/A"
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What Happened
      description: Actual outcome. Include data if available.
      placeholder: The actual result was...
    validations:
      required: false

  - type: textarea
    id: what-learned
    attributes:
      label: What Did We Learn
      description: Key insight. How does this change our understanding?
      placeholder: We learned that...
    validations:
      required: false

  - type: textarea
    id: next-step
    attributes:
      label: Next Step
      description: Based on what we learned, what is the next experiment? Link to the new issue if created.
      placeholder: The next experiment is...
    validations:
      required: false
