name: Target Condition
description: Toyota Kata target condition umbrella issue linked to a milestone
title: "Target Condition: "
labels: ["target-condition"]
body:
  - type: input
    id: vision
    attributes:
      label: Vision
      description: 1 sentence describing vision according to README.md
      placeholder: "e.g., Software that flows like water..."
    validations:
      required: true

  - type: textarea
    id: direction
    attributes:
      label: Direction
      description: 1-2 sentences describing the desired shift. Use active voice.
      placeholder: "Move from X to Y..."
    validations:
      required: true

  - type: textarea
    id: qualitative-description
    attributes:
      label: Qualitative Description
      description: Use either the table format or BDD rules/scenarios to describe current vs target
      value: |
        | Aspect | Current | Target |
        |--------|---------|--------|
        | Detection approach | e.g., Reactive, manual | e.g., Automated, continuous |
        | Remediation process | e.g., Ad-hoc, unbounded | e.g., SLA-driven, tracked |
        | Coverage scope | e.g., Direct deps only | e.g., Full transitive tree |
        | CI enforcement | e.g., No gates | e.g., Blocking audit gate |
        | Policy definition | e.g., Undefined SLAs | e.g., Severity-based SLAs |
    validations:
      required: true

  - type: textarea
    id: outcome-metrics
    attributes:
      label: Outcome Metrics
      description: Measurable outcomes with current baseline and target values
      value: |
        | Metric | Current | Target |
        |--------|---------|--------|
        | e.g., Critical vulnerabilities | e.g., 3 | e.g., 0 |
        | e.g., Test coverage % | e.g., 65% | e.g., 80% |
    validations:
      required: true

  - type: textarea
    id: process-metrics
    attributes:
      label: Process Metrics
      description: Process measurements with current baseline and target values
      value: |
        | Metric | Current | Target |
        |--------|---------|--------|
        | Mean Time to Detect (MTTD) | e.g., 7 days | e.g., 1 day |
        | Mean Time to Remediate (MTTR) — critical | e.g., 14 days | e.g., 3 days |
        | Mean Time to Remediate (MTTR) — high | e.g., 30 days | e.g., 7 days |
        | e.g., Deployment frequency | e.g., weekly | e.g., daily |
    validations:
      required: false
