name: Deploy to Production

on:
  workflow_dispatch:

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    environment: main
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c # v4

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Graduate Release
        run: pnpm graduate
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Push Release Commit and Tags
        run: |
          git push
          git push --tags

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2

      - name: Generate Prisma client
        run: pnpm prisma:generate:postgres

      - name: Build all projects
        run: |
          NX_BRANCH=${GITHUB_REF#refs/heads/} pnpm nx run-many --target=build --all=true --parallel=3
          NX_BRANCH=${GITHUB_REF#refs/heads/} pnpm nx run-many --target=post-build --all=true --parallel=3

  deploy-kernel:
    name: Deploy Kernel Team
    permissions:
      contents: read
      id-token: write
    needs: build
    uses: ./.github/workflows/teams-kernel-workflows-deploy-team.yml
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_LOCATION: ${{ secrets.GCP_LOCATION }}
      SUPPORT_ACCOUNT_EMAIL: ${{ secrets.SUPPORT_ACCOUNT_EMAIL }}
      OWNER_ACCOUNT_EMAIL: ${{ secrets.OWNER_ACCOUNT_EMAIL }}
      GCP_BILLING_ACCOUNT_ID: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
      GCP_ORGANIZATION_ID: ${{ secrets.GCP_ORGANIZATION_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_LOCATION: ${{ secrets.NEON_PROJECT_LOCATION }}
      UNLEASH_API_URL: ${{ secrets.UNLEASH_API_URL }}
      UNLEASH_AUTH_TOKEN: ${{ secrets.UNLEASH_AUTH_TOKEN }}
      MONGODB_ATLAS_ORG_ID: ${{ secrets.MONGODB_ATLAS_ORG_ID }}
      MONGODB_ATLAS_PRIVATE_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_KEY }}
      MONGODB_ATLAS_PUBLIC_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_KEY }}
    with:
      team-name: kernel
      iac-path: teams/kernel/iac/production

  deploy-people:
    name: Deploy People Team
    permissions:
      contents: read
      id-token: write
    needs: deploy-kernel
    if: needs.deploy-kernel.result == 'success'
    uses: ./.github/workflows/teams-kernel-workflows-deploy-team.yml
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_LOCATION: ${{ secrets.GCP_LOCATION }}
      SUPPORT_ACCOUNT_EMAIL: ${{ secrets.SUPPORT_ACCOUNT_EMAIL }}
      OWNER_ACCOUNT_EMAIL: ${{ secrets.OWNER_ACCOUNT_EMAIL }}
      GCP_BILLING_ACCOUNT_ID: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
      GCP_ORGANIZATION_ID: ${{ secrets.GCP_ORGANIZATION_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_LOCATION: ${{ secrets.NEON_PROJECT_LOCATION }}
      UNLEASH_API_URL: ${{ secrets.UNLEASH_API_URL }}
      UNLEASH_AUTH_TOKEN: ${{ secrets.UNLEASH_AUTH_TOKEN }}
      MONGODB_ATLAS_ORG_ID: ${{ secrets.MONGODB_ATLAS_ORG_ID }}
      MONGODB_ATLAS_PRIVATE_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_KEY }}
      MONGODB_ATLAS_PUBLIC_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_KEY }}
    with:
      team-name: people
      iac-path: teams/people/iac/production

  deploy-things:
    name: Deploy Things Team
    needs: deploy-kernel
    permissions:
      contents: read
      id-token: write
    if: needs.deploy-kernel.result == 'success'
    uses: ./.github/workflows/teams-kernel-workflows-deploy-team.yml
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_LOCATION: ${{ secrets.GCP_LOCATION }}
      SUPPORT_ACCOUNT_EMAIL: ${{ secrets.SUPPORT_ACCOUNT_EMAIL }}
      OWNER_ACCOUNT_EMAIL: ${{ secrets.OWNER_ACCOUNT_EMAIL }}
      GCP_BILLING_ACCOUNT_ID: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
      GCP_ORGANIZATION_ID: ${{ secrets.GCP_ORGANIZATION_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_LOCATION: ${{ secrets.NEON_PROJECT_LOCATION }}
      UNLEASH_API_URL: ${{ secrets.UNLEASH_API_URL }}
      UNLEASH_AUTH_TOKEN: ${{ secrets.UNLEASH_AUTH_TOKEN }}
      MONGODB_ATLAS_ORG_ID: ${{ secrets.MONGODB_ATLAS_ORG_ID }}
      MONGODB_ATLAS_PRIVATE_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_KEY }}
      MONGODB_ATLAS_PUBLIC_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_KEY }}
    with:
      team-name: things
      iac-path: teams/things/iac/production

  emit-compass-deployment:
    name: Emit Compass Deployment Event
    permissions:
      contents: read
    needs: [deploy-kernel, deploy-people, deploy-things]
    if: false # Intentionally disabled
    runs-on: ubuntu-latest
    steps:
      - name: Emit deployment event
        env:
          ATLASSIAN_DOMAIN: ${{ secrets.ATLASSIAN_DOMAIN }}
          ATLASSIAN_CLOUD_ID: ${{ secrets.ATLASSIAN_CLOUD_ID }}
          ATLASSIAN_USER_EMAIL: ${{ secrets.ATLASSIAN_USER_EMAIL }}
          ATLASSIAN_USER_API_TOKEN: ${{ secrets.ATLASSIAN_USER_API_TOKEN }}
          COMPASS_EXTERNAL_EVENT_SOURCE_ID: ${{ secrets.COMPASS_EXTERNAL_EVENT_SOURCE_ID }}
        run: |
          echo "Deployment complete. Compass event emission intentionally disabled."
