apiVersion: v1
kind: Namespace
metadata:
  name: logto
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: logto
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: p0stgr3s
            - name: POSTGRES_DB
              value: logto
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: logto
spec:
  selector:
    app: postgresql
  ports:
    - port: 5432
      targetPort: 5432
