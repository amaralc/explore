apiVersion: v1
kind: Namespace
metadata:
  name: logto
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: logto
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgresql
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: logto
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
              ephemeral-storage: "128Mi"
            limits:
              memory: "256Mi"
              cpu: "250m"
              ephemeral-storage: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: logto
spec:
  selector:
    app: postgresql
  ports:
    - port: 5432
      targetPort: 5432
