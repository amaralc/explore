apiVersion: v1
kind: Secret
metadata:
  name: logto-db-credentials
  namespace: logto
  labels:
    app.kubernetes.io/name: logto
    app.kubernetes.io/part-of: security-iam-svc
type: Opaque
# In production, this secret is populated by Crossplane via writeConnectionSecretToRef.
# For local development, it is created dynamically by setup-local.sh with a generated password.
