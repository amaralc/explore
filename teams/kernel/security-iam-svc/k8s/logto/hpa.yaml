apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: logto
  namespace: logto
  labels:
    app.kubernetes.io/name: logto
    app.kubernetes.io/part-of: security-iam-svc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: logto
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
