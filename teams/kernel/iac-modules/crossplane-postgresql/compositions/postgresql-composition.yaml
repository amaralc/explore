apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: postgresql-cloudsql
  labels:
    provider: gcp
    database: postgresql
spec:
  compositeTypeRef:
    apiVersion: database.peerlab.io/v1alpha1
    kind: XPostgreSQLInstance
  writeConnectionSecretsToNamespace: crossplane-system
  resources:
    - name: cloudsql-instance
      base:
        apiVersion: sql.gcp.upbound.io/v1beta2
        kind: DatabaseInstance
        spec:
          forProvider:
            databaseVersion: POSTGRES_17
            region: us-central1
            deletionProtection: false
            settings:
              - tier: db-f1-micro
                diskSize: 10
                diskType: PD_SSD
                ipConfiguration:
                  - ipv4Enabled: true
          providerConfigRef:
            name: gcp-provider-config
      patches:
        - type: FromCompositeFieldPath
          fromFieldPath: spec.parameters.version
          toFieldPath: spec.forProvider.databaseVersion
        - type: FromCompositeFieldPath
          fromFieldPath: spec.parameters.region
          toFieldPath: spec.forProvider.region
        - type: FromCompositeFieldPath
          fromFieldPath: spec.parameters.tier
          toFieldPath: spec.forProvider.settings[0].tier
        - type: FromCompositeFieldPath
          fromFieldPath: spec.parameters.storageGB
          toFieldPath: spec.forProvider.settings[0].diskSize
      connectionDetails:
        - name: host
          fromFieldPath: status.atProvider.publicIpAddress
          type: FromFieldPath
        - name: port
          type: FromValue
          value: "5432"
    - name: cloudsql-user
      base:
        apiVersion: sql.gcp.upbound.io/v1beta1
        kind: User
        spec:
          forProvider:
            instanceSelector:
              matchControllerRef: true
            passwordSecretRef:
              key: password
              namespace: crossplane-system
          providerConfigRef:
            name: gcp-provider-config
      connectionDetails:
        - name: username
          fromFieldPath: metadata.name
          type: FromFieldPath
